version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    # Open dependency PRs against the integration branch, not the default (main).
    # main only ever receives changes via a develop -> main promotion.
    target-branch: develop

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
