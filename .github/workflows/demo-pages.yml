name: Demo (GitHub Pages)

# Builds the static, MSW-backed demo of the frontend (#142) and deploys it to
# GitHub Pages. Read-only, no backend. One-time setup: repo Settings → Pages →
# Source = "GitHub Actions".

on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel an in-progress run if a newer one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run build:demo

      - uses: actions/configure-pages@v5
        # Auto-provision the Pages site on first run so no manual
        # Settings → Pages toggle is required.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
