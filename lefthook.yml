pre-commit:
  parallel: true
  commands:
    go-vet:
      root: "backend/"
      run: go vet ./...
    go-fmt:
      root: "backend/"
      run: gofmt -w .
    tsc:
      root: "frontend/"
      run: npx tsc --noEmit
    eslint:
      root: "frontend/"
      glob: "src/**/*.{ts,tsx}"
      run: npx eslint {staged_files}
    prettier:
      root: "frontend/"
      glob: "src/**/*.{ts,tsx,css}"
      run: npx prettier --write {staged_files} && git add {staged_files}
