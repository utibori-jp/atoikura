# Compose override that adds a `dev` service for the devcontainer.
# Combined with the root docker-compose.yml via devcontainer.json's
# dockerComposeFile list, so the existing db / backend / frontend / adminer
# services are unchanged.
#
# `runServices: ["db", "adminer"]` in devcontainer.json keeps the heavier
# backend/frontend compose services from starting automatically — they're
# meant for production-style previews, not the dev loop. Inside the
# devcontainer you run `make run` (backend) and `npm run dev` (frontend)
# natively.
services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    # NET_ADMIN + NET_RAW are required for init-firewall.sh (iptables/ipset).
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Grant the `node` user access to the host Docker socket.
    #
    # Docker Desktop / WSL2 exposes /var/run/docker.sock owned by root:root with
    # mode 660. The docker-outside-of-docker feature's runtime helper would
    # normally fix this by chgrp-ing the socket or starting a socat proxy, but
    # both paths go through `sudo`, and this devcontainer only grants passwordless
    # sudo for init-firewall.sh — so the helper fails and the socket stays
    # inaccessible to `node`. Adding `node` to group 0 (root) makes the socket's
    # group rw bit apply, which is enough for `docker` / `docker compose`.
    #
    # Group 0 membership does NOT grant uid-0 / CAP_NET_ADMIN, so it does not let
    # the container bypass the egress firewall (init-firewall.sh still needs sudo).
    group_add:
      - "0"
    volumes:
      - ..:/workspace:cached
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
    environment:
      DATABASE_URL: postgres://atoikura:dev_password@db:5432/atoikura?sslmode=disable
      PORT: 8080
      VITE_API_URL: http://localhost:8080
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    # Keep the container alive so VS Code can attach.
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

volumes:
  claude-code-bashhistory:
  claude-code-config:
