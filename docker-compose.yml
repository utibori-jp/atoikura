services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atoikura
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: atoikura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoikura -d atoikura"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://atoikura:dev_password@db:5432/atoikura?sslmode=disable
      PORT: 8080
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      JWT_SECRET: dev-jwt-secret-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines env vars at build time, so VITE_API_URL must be a build
        # arg (a runtime `environment:` value has no effect on the static bundle).
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - 8001:8080

volumes:
  postgres_data:
