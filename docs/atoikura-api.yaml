          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /statement-types:
    get:
      summary: 変動費分析用グループ一覧取得
      description: |
        変動費分析用グループの一覧を返す。固定マスタのためCRUDなし。
        大分類の追加・編集フォームのプルダウン表示に使用する。
        `id` 昇順で返す。

        **利用画面：**
        - マスタ管理：大分類追加・編集フォームのプルダウン
      operationId: getStatementTypes
      tags:
        - statement-types
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - statement_types
                properties:
                  statement_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatementTypeSummary'
              example:
                statement_types:
                  - id: 1
                    type_code: "food"
                    statement_type_name: "食費"
                  - id: 2
                    type_code: "other"
                    statement_type_name: "その他"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /budgets:
    get:
      summary: 予算・目標取得
      description: |
        ログインユーザーの予算・目標設定を返す。
        レコードが未作成の場合も200を返し、全フィールドをnullで返す。

        **利用画面：**
        - 目標設定画面：初期表示
      operationId: getBudgets
      tags:
        - budgets
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
              example:
                monthly_budget: 150000
                goal_text: "夏までに旅行費を貯める"
                goal_amount: 300000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: 予算・目標更新
      description: |
        ログインユーザーの予算・目標設定を更新する。
        レコードが未作成の場合はINSERT、作成済みの場合はUPDATEを行う（upsert）。
        全フィールド任意。変更しないフィールドは現在値をそのまま送ること。
        nullを送ると未設定状態に戻る。
        `monthly_budget` に0以下の値を送った場合は400を返す。

        **利用画面：**
        - 目標設定画面：保存
      operationId: updateBudgets
      tags:
        - budgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
            example:
              monthly_budget: 120000
              goal_text: "夏までに旅行費を貯める"
              goal_amount: 300000
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
              example:
                monthly_budget: 120000
                goal_text: "夏までに旅行費を貯める"
                goal_amount: 300000
        '400':
          description: リクエスト不正（monthly_budgetが0以下など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BAD_REQUEST
                message: "monthly_budgetは1以上の整数である必要があります"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /journal-entries:
    get:
      summary: 仕訳一覧取得
      description: |
        指定月の仕訳一覧を日付ごとにグループ化して返す。
        日付降順、各日付内はid降順（登録が新しい順）。

        **利用画面：**
        - 仕訳一覧：指定月の仕訳履歴表示
      operationId: getJournalEntries
      tags:
        - journal-entries
      parameters:
        - name: year_month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 対象年月（YYYY-MM）
          example: "2025-05"
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryListResponse'
              example:
                year_month: "2025-05"
                entries:
                  - date: "2025-05-05"
                    journal_entries:
                      - id: 43
                        transaction_date: "2025-05-05"
                        item: "ランチ"
                        amount: 1200
                        category_id: 2
                        category_name: "外食"
                        group_id: 1
                        group_name: "食費"
                        is_excluded: false
                        note: null
                        created_at: "2025-05-05T13:00:00Z"
                      - id: 42
                        transaction_date: "2025-05-05"
                        item: "コンビニ"
                        amount: 650
                        category_id: 1
                        category_name: "スーパー"
                        group_id: 1
                        group_name: "食費"
                        is_excluded: false
                        note: "昼飯"
                        created_at: "2025-05-05T12:34:56Z"
                  - date: "2025-05-03"
                    journal_entries:
                      - id: 41
                        transaction_date: "2025-05-03"
                        item: "電車代"
                        amount: 480
                        category_id: 5
                        category_name: "電車・バス"
                        group_id: 2
                        group_name: "交通費"
                        is_excluded: false
                        note: null
                        created_at: "2025-05-03T09:10:00Z"
        '400':
          description: year_monthの形式不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BAD_REQUEST
                message: "year_monthはYYYY-MM形式で指定してください"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: 仕訳登録
      description: |
        仕訳を新規登録する。

        **利用画面：**
        - ホーム：仕訳入力フォーム
        - 仕訳一覧：仕訳追加

        **フォームの操作フロー（フロント側）：**
        大分類を選択 → 生活区分を大分類でフィルタリング → 生活区分を選択。
        APIには選択結果の `category_id`（生活区分ID）のみ送信する。
      operationId: createJournalEntry
      tags:
        - journal-entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryRequest'
            example:
              transaction_date: "2025-05-05"
              item: "コンビニ"
              amount: 650
              category_id: 1
              is_excluded: true
              note: "昼飯"
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
              example:
                id: 42
                transaction_date: "2025-05-05"
                item: "コンビニ"
                amount: 650
                category_id: 1
                category_name: "スーパー"
                group_id: 1
                group_name: "食費"
                is_excluded: true
                note: "昼飯"
                created_at: "2025-05-05T12:34:56Z"
        '400':
          description: リクエスト不正（必須項目欠落・amountが0以下など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BAD_REQUEST
                message: "amountは正の整数である必要があります"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /journal-entries/{id}:
    put:
      summary: 仕訳更新
      description: |
        指定した仕訳を更新する。全フィールドを毎回送信する（PUT）。
        `transaction_date` の変更も許容する（入力ミス修正のユースケースに対応）。

        - 論理削除済み・他ユーザーのリソースは404を返す

        **利用画面：**
        - 仕訳一覧：仕訳編集・コメント修正
      operationId: updateJournalEntry
      tags:
        - journal-entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 仕訳ID
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryRequest'
            example:
              transaction_date: "2025-05-05"
              item: "コンビニ（修正）"
              amount: 700
              category_id: 1
              is_excluded: false
              note: "昼飯のついでに買い物"
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
              example:
                id: 42
                transaction_date: "2025-05-05"
                item: "コンビニ（修正）"
                amount: 700
                category_id: 1
                category_name: "スーパー"
                group_id: 1
                group_name: "食費"
                is_excluded: false
                note: "昼飯のついでに買い物"
                created_at: "2025-05-05T12:34:56Z"
        '400':
          description: リクエスト不正（必須項目欠落・amountが0以下など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BAD_REQUEST
                message: "amountは正の整数である必要があります"
        '404':
          description: 指定した仕訳が存在しない（論理削除済み・他ユーザーのリソースを含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: NOT_FOUND
                message: "仕訳が見つかりません"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: 仕訳削除
      description: |
        指定した仕訳を物理削除する。
        マスタ系（生活区分・大分類）の論理削除と異なり、仕訳は他テーブルから参照されないため物理削除とする。

        - 他ユーザーのリソースは404を返す

        **利用画面：**
        - 仕訳一覧:仕訳削除
      operationId: deleteJournalEntry
      tags:
        - journal-entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 仕訳ID
          example: 42
      responses:
        '204':
          description: 削除成功（ボディなし）
        '404':
          description: 指定した仕訳が存在しない（他ユーザーのリソースを含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: NOT_FOUND
                message: "仕訳が見つかりません"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notes/monthly-reviews:
    get:
      summary: 月次振り返りメモ取得
      description: |
        指定月の生活区分ごとの振り返りメモ一覧を返す。
        `GET /expenses/monthly-breakdown` の集計データとフロント側で `category_id` をキーに突合して表示する。

        レコードが未作成の場合も200を返し、`notes` を空配列で返す。

        **利用画面：**
        - 振り返り画面：生活区分ごとのメモ表示
      operationId: getMonthlyReviews
      tags:
        - notes
      parameters:
        - name: year_month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 対象年月（YYYY-MM）
          example: "2025-04"
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReviewResponse'
              example:
                year_month: "2025-04"
                notes:
                  - category_id: 1
                    note: "スーパーで買いすぎた。特売につられがち"
                  - category_id: 3
                    note: "今月は外食少なめで頑張れた"
        '400':
          description: year_monthの形式不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BAD_REQUEST
                message: "year_monthはYYYY-MM形式で指定してください"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: 月次振り返りメモ保存
      description: |
        指定月の生活区分ごとの振り返りメモを保存する。
        レコードが未作成の場合はINSERT、作成済みの場合はUPDATEを行う（upsert）。
        送信内容で **全件洗い替え**（jsonbを丸ごと置き換え）。

        **空文字の扱い：**
        `note` が空文字のエントリはサーバー側で除外してDBに保存しない。
        ユーザーがメモを空にして保存した場合、そのカテゴリのメモは削除扱いになる。

        `notes` を空配列で送ると、その月のメモを全件削除する。

        **利用画面：**
        - 振り返り画面：生活区分ごとのメモ保存
      operationId: putMonthlyReviews
      tags:
        - notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - year_month
                - notes
              properties:
                year_month:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  description: 対象年月（YYYY-MM）
                  example: "2025-04"
                notes:
                  type: array
                  description: |
                    生活区分ごとのメモ一覧。空配列で全件削除。
                    `note` が空文字のエントリはサーバー側で除外する。
                  items:
                    $ref: '#/components/schemas/MonthlyReviewNote'
            example:
              year_month: "2025-04"
              notes:
                - category_id: 1
                  note: "スーパーで買いすぎた。特売につられがち"
                - category_id: 3
                  note: "今月は外食少なめで頑張れた"
                - category_id: 5
                  note: ""
      responses:
        '200':
          description: 保存成功（空文字エントリは除外して返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReviewResponse'
              example:
                year_month: "2025-04"
                notes:
                  - category_id: 1
                    note: "スーパーで買いすぎた。特売につられがち"
                  - category_id: 3
                    note: "今月は外食少なめで頑張れた"
        '400':
          description: リクエスト不正（year_month形式不正・必須項目欠落など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BAD_REQUEST
                message: "year_monthはYYYY-MM形式で指定してください"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

