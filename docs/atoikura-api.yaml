  /notes/daily/{date}:
    put:
      summary: 日次コメント保存
      description: |
        指定日付のコメントを保存する。
        レコードが未作成の場合はINSERT、作成済みの場合はUPDATEを行う（upsert）。

        **空文字の扱い：**
        `note` が空文字の場合、レコードを物理削除する。
        レスポンスは `note: null` を返す（フロント側はステータスコードで挙動を分岐しなくてよい）。

        **利用画面：**
        - 仕訳一覧：日付ごとのコメント入力・編集
      operationId: putDailyNote
      tags:
        - notes
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
          description: 対象日付（YYYY-MM-DD）
          example: "2025-05-05"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
                  description: コメントテキスト。空文字で削除扱い（レコードを物理削除し、nullを返す）
                  example: "ディズニー行ったから出費多め"
            example:
              note: "ディズニー行ったから出費多め"
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyNote'
              examples:
                saved:
                  summary: コメントあり
                  value:
                    date: "2025-05-05"
                    note: "ディズニー行ったから出費多め"
                deleted:
                  summary: 空文字送信→削除（nullで返す）
                  value:
                    date: "2025-05-05"
                    note: null
        '400':
          description: リクエスト不正（dateの形式不正・必須項目欠落など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BAD_REQUEST
                message: "dateはYYYY-MM-DD形式で指定してください"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

